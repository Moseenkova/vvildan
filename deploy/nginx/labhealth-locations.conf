# Place inside the existing HTTPS server block for labhealth.pro, replacing
# its default "location /". Keep the existing TLS certificate configuration.
# Change port 8080 if APP_PORT in the deployment .env uses another port.
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Cross-Origin-Opener-Policy;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
}
