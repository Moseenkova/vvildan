[project]
name = "courier-bot"
version = "0.1.0"
description = ""
authors = [
    { name = "bikmetle", email = "hamid-nv@vivaldi.net" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "aiogram>=3.4.1",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.5.0",
    "pydantic-settings>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py39"]

[tool.ruff]
select = ["E", "F"]
ignore = ["E501", "E741"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
