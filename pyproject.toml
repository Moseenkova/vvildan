[project]
name = "courier-bot"
version = "0.1.0"
description = ""
authors = [
    { name = "bikmetle", email = "hamid-nv@vivaldi.net" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.4.1",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.32.0",
    "python-jose[cryptography]>=3.5.0",
    "pydantic-settings>=2.11.0",
    "fastapi-pagination (==0.15.16)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py39"]

[tool.ruff]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]

[tool.hatch.build.targets.wheel]
packages = ["src", "bot"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "pre-commit>=4.6.2",
]
